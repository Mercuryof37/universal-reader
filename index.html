<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- theme_color 与 manifest 保持一致：Android 状态栏、iOS 顶部栏都会取它 -->
    <meta name="theme-color" content="#2b2620" />
    <meta
      name="description"
      content="通用文档阅读器：导入 md / txt / pdf / epub，双语对照阅读、语音朗读与批注。全部在本地浏览器完成，文档不上传。"
    />

    <!--
      PWA 相关。
      manifest 由 vite-plugin-pwa 在构建时注入，这里只声明 iOS 需要的补充项：
      iOS 不读 manifest 里的 display 与图标，必须用 apple-* 系列 meta 单独声明，
      否则「添加到主屏幕」后会用网页截图当图标、且仍带浏览器地址栏。
    -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="文档阅读器" />

    <title>通用文档阅读器</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
